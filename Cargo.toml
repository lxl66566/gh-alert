[package]
edition = "2024"
name    = "gh-alert"
version = "0.1.1"

[dependencies]
clap              = { version = "4", features = ["derive"] }
home              = "0.5"
log               = "0.4"
percent-encoding  = "2"
pretty_env_logger = "0.5"
reqwest           = { version = "0.12", features = ["blocking", "json"] }
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
