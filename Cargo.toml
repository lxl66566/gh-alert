[package]
edition      = "2024"
license      = "Unlicense"
name         = "gh-alert"
rust-version = "1.85"
version      = "0.3.0"

[dependencies]
anyhow            = "1"
clap              = { version = "4", features = ["derive"] }
dirs              = "5"
futures-util      = "0.3"
log               = "0.4"
pretty_env_logger = "0.5"
reqwest           = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset", "system-proxy"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all      = "warn"
pedantic = "warn"

[profile.release]
lto       = true
opt-level = "z"
panic     = "abort"
strip     = true
